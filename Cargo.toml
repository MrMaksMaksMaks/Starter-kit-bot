[workspace]
members = [
    
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
authors = ["Maksim <maksim@example.com>"]
license = "MIT"
repository = "https://github.com/MrMaksMaksMaks/Starter-kit-bot"
description = "Open-source Starter-kit for Non-custodial Telegram bot on Solana"

[package]
name = "starter-kit-bot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "starter_kit_bot"
path = "src/lib.rs"

[[bin]]
name = "starter-kit-bot"
path = "src/bin/main.rs"

[dependencies]
teloxide = { version = "0.12", features = ["macros"] }
base64 = "0.22"
pem = "3"
jsonwebtoken = "9"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.7", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
solana-client = "1.18"
solana-sdk = "1.18"
solana-program = "1.18"
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
tokio = { version = "1.37", features = ["full"] }
dotenv = "0.15"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
bincode = "1.3"
sqlx = { version = "0.7.4", default-features = false, features = [
    "sqlite",
    "runtime-tokio-rustls",
    "macros",
    "chrono",
] }
# jupiter-swap-api-client = { git = "https://github.com/jup-ag/jupiter-swap-api-client.git", package = "jupiter-swap-api-client"} 

[profile.release]
overflow-checks = true
lto = true

[patch.crates-io.aes-gcm-siv]
git = "https://github.com/RustCrypto/AEADs"
rev = "6105d7a5591aefa646a95d12b5e8d3f55a9214ef"

[patch.crates-io.curve25519-dalek]
git = "https://github.com/solana-labs/curve25519-dalek.git"
rev = "c14774464c4d38de553c6ef2f48a10982c1b4801"
solana-client = "1.18"
solana-sdk = "1.18"
solana-program = "1.18"
spl-token = "4.0"
spl-associated-token-account = "3.0"
