<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .box { fill: #f0f4f8; stroke: #1a202c; stroke-width: 2; rx: 8; }
      .title { fill: #1a202c; font-family: Arial; font-size: 18px; font-weight: bold; }
      .label { fill: #2d3748; font-family: Arial; font-size: 13px; }
      .arrow { stroke: #4a5568; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-label { fill: #4a5568; font-family: Arial; font-size: 11px; }
      .module { fill: #ebf8ff; stroke: #3182ce; stroke-width: 2; rx: 6; }
      .api { fill: #f0fff4; stroke: #38a169; stroke-width: 2; rx: 6; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a5568" />
    </marker>
  </defs>

  <!-- Telegram User -->
  <rect x="300" y="20" width="200" height="50" class="box" />
  <text x="400" y="50" text-anchor="middle" class="title">📱 Telegram User</text>

  <!-- Telegram Bot API -->
  <rect x="300" y="100" width="200" height="50" class="box" />
  <text x="400" y="130" text-anchor="middle" class="title">🤖 Telegram Bot API</text>

  <!-- Стрелка: User → Bot API -->
  <line x1="400" y1="70" x2="400" y2="95" class="arrow" />

  <!-- main.rs -->
  <rect x="200" y="180" width="400" height="80" class="box" />
  <text x="400" y="210" text-anchor="middle" class="title">⚙️ main.rs (Command Handler)</text>
  <text x="400" y="235" text-anchor="middle" class="label">/create_wallet  /balance  /buy  /sell  /withdraw</text>

  <!-- Стрелка: Bot API → main.rs -->
  <line x1="400" y1="150" x2="400" y2="175" class="arrow" />

  <!-- Modules -->
  <rect x="50" y="300" width="700" height="60" class="box" rx="4" />
  <text x="400" y="325" text-anchor="middle" class="label" fill="#1a202c">📦 Modules</text>
  <text x="400" y="345" text-anchor="middle" class="label">balance/  config/  db/  jupiter/  openfort/  solana/  withdraw/</text>

  <!-- Стрелка: main.rs → Modules -->
  <line x1="400" y1="260" x2="400" y2="295" class="arrow" />

  <!-- External APIs -->
  <rect x="50" y="400" width="700" height="60" class="box" rx="4" />
  <text x="400" y="425" text-anchor="middle" class="label" fill="#1a202c">🌐 External APIs</text>
  <text x="400" y="445" text-anchor="middle" class="label">Jupiter API  Openfort API  Solana RPC  Kora API</text>

  <!-- Стрелка: Modules → APIs -->
  <line x1="400" y1="360" x2="400" y2="395" class="arrow" />

  <!-- SQLite -->
  <rect x="300" y="500" width="200" height="50" class="box" />
  <text x="400" y="530" text-anchor="middle" class="title">🗄️ SQLite Database</text>

  <!-- Стрелка: APIs → SQLite -->
  <line x1="400" y1="460" x2="400" y2="495" class="arrow" />
</svg>
