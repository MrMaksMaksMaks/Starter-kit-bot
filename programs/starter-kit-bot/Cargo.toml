[package]
name = "starter_kit_bot_program"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
authors = ["Maksim <maksim@example.com>"]
license = "MIT"
repository = "https://github.com/MrMaksMaksMaks/Starter-kit-bot"
description = "Solana program for Starter-Kit-Bot"

[lib]
crate-type = ["cdylib", "lib"]
name = "starter_kit_bot_program"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "0.30.1"
solana-program = "2.0"

[dev-dependencies]
anchor-lang = "0.30.1"
solana-program = "2.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
